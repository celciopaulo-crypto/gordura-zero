h1,h2{font-family:Sora,Inter,sans-serif;font-weight:700}h1{font-size:25px;margin:4px 0 2px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}.tag{color:var(--ac);font:700 13px Sora,sans-serif;letter-spacing:.08em;text-align:center;margin:0 0 14px}
.logo{display:block;width:100%;max-width:300px;margin:0 auto;mix-blend-mode:lighten}.logo.sm{max-width:150px;margin:0}
.gear{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);background:var(--c);width:42px;height:42px;padding:0;font-size:20px;border-radius:50%}
.card{background:var(--c);border-radius:14px;padding:16px;margin:12px 0}
.big,.st b,.tm{font-family:Inter,sans-serif;font-weight:600}.big{font-size:44px;letter-spacing:-.03em;line-height:1}
.tm{font-size:96px;line-height:1;margin:6px 0;color:var(--ac)}.tm.rest{color:var(--or)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.st b{display:block;font-size:22px}.st span{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{background:var(--c2);color:var(--tx);border:0;border-radius:12px;padding:12px 16px;font:600 16px Inter,sans-serif}
button.p{background:var(--ac);color:var(--bg)}button.d{color:var(--bad)}button.sm{padding:8px 12px;font-size:14px}
label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px}label.ck input{width:auto}
input,select,textarea{width:100%;background:var(--bg);border:1px solid #38453d;color:var(--tx);border-radius:10px;padding:12px;font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#111713ee;backdrop-filter:blur(14px);padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid #2d3831;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;color:var(--mut);padding:8px 0;font-size:11.5px}nav button.on{color:var(--ac)}
.warn{border-left:4px solid var(--or)}.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #2d3831;font-size:14px}
.chip{display:inline-block;background:var(--bg);color:var(--ac);border-radius:8px;padding:2px 8px;font-size:12px;margin-right:4px}
video{width:100%;border-radius:10px;margin-top:8px}svg{width:100%;height:auto}.lock{text-align:center;padding-top:12vh}.lock input{text-align:center;font-size:28px;letter-spacing:.4em;max-width:220px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:5;width:54px;height:54px;border-radius:50%;background:var(--ac);color:var(--bg);font:700 15px Sora,sans-serif;padding:0}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;background:var(--c)}.msg.u{background:var(--c2);margin-left:36px}textarea{min-height:80px;resize:vertical}
details.inf summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:10px}details.inf p{margin:6px 0 0}details.card>summary{list-style:none}
</style>

'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'), iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), today=()=>iso(new Date());
const r1=n=>(Math.round(n*10)/10).toLocaleString('pt-PT');
/* ---------- Armazenamento local (IndexedDB) ---------- */
const DB=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((ok,no)=>{const q=indexedDB.open('treino',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;ok(db)};q.onerror=()=>no(q.error)});
const tx=async(m,f)=>{const d=await open();return new Promise((ok,no)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
return{keys:async()=>{const d=await open();return new Promise(ok=>{d.transaction('kv').objectStore('kv').getAllKeys().onsuccess=e=>ok(e.target.result)})},get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),clear:()=>tx('readwrite',s=>s.clear()),
all:async()=>{const d=await open();return new Promise(ok=>{const o={};d.transaction('kv').objectStore('kv').openCursor().onsuccess=e=>{const c=e.target.result;if(c){if(!/^(vid|foto):/.test(c.key))o[c.key]=c.value;c.continue()}else ok(o)}})}}})();
let S={profile:null,weights:[],water:{},train:{},pin:null,meta:{}},view='hoje',locked=false;
const save=k=>DB.set(k,S[k]);
/* ---------- Cálculos (estimativas, não medições) ---------- */
const lastW=()=>{const a=S.weights.filter(x=>x.w);return a.length?a[a.length-1].w:S.profile?.peso};
const imc=()=>lastW()/Math.pow(S.profile.altura/100,2);
function avg7(){const a=S.weights.filter(x=>x.w);if(!a.length)return null;const e=new Date(a[a.length-1].d).getTime(),s=a.filter(x=>e-new Date(x.d).getTime()<=6*864e5);return s.reduce((t,x)=>t+x.w,0)/s.length}
function calc(){const p=S.profile,w=lastW();const bmr=10*w+6.25*p.altura-5*p.idade+(p.sexo==='m'?5:-161),tdee=bmr*(typeof actF==='function'?actF():p.act);
let def=p.ritmo*7700/7;const max=tdee*.25,capped=def>max;def=Math.min(def,max);const kcal=Math.max(tdee-def+(S.adj||0),bmr);def=tdee-kcal;
const ref=Math.min(w,(p.meta||w)+10),prot=Math.round(ref*1.6),fat=Math.round(kcal*.25/9),carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
const treino=!!S.train[today()],agua=Math.round((w*30+(treino?(S.log&&S.log[today()]?S.log[today()].min*13:500):0)+([0,300,500][S.temp!=null?S.temp:(S.quente?2:0)]||0))/50)*50;
return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal),def:Math.round(def),real:def*7/7700,capped,prot,fat,carb,agua,treino}}
/* ---------- PIN ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>pad(x.toString(16))).join('');
async function hashPin(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
/* ---------- Gráfico ---------- */
function chart(){const a=S.weights.filter(x=>x.w).slice(-40);if(a.length<2)return'<p class="mut">Regista pelo menos 2 pesagens para ver o gráfico.</p>';
const ws=a.map(x=>x.w),mn=Math.min(...ws)-1,mx=Math.max(...ws)+1,X=i=>24+i*(280/(a.length-1)),Y=v=>12+(mx-v)/(mx-mn)*116;
const raw=a.map((x,i)=>X(i)+','+Y(x.w)).join(' '),av=a.map((x,i)=>{const s=a.slice(Math.max(0,i-6),i+1);return X(i)+','+Y(s.reduce((t,y)=>t+y.w,0)/s.length)}).join(' ');
return`<svg viewBox="0 0 320 150"><polyline points="${raw}" fill="none" stroke="#5a5e69" stroke-width="1.5"/><polyline points="${av}" fill="none" stroke="#B7F34A" stroke-width="3" stroke-linecap="round"/>
<text x="2" y="22" fill="#8C8F98" font-size="10">${r1(mx)}</text><text x="2" y="130" fill="#8C8F98" font-size="10">${r1(mn)}</text></svg><p class="mut">Cinzento: pesagens. Laranja: média móvel de 7 dias (a que importa).</p>`}
/* ---------- Ecrãs ---------- */
const field=(id,l,v,t='number',x='')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v??'')}" ${t==='number'?'inputmode="decimal" step="any"':''} ${x}></div>`;
function formPerfil(){const p=S.profile||{};const sel=(v,o)=>o.map(([k,l])=>`<option value="${k}" ${String(v)===String(k)?'selected':''}>${l}</option>`).join('');
return`<div class="f2">${field('f-idade','Idade (anos)',p.idade)}<div><label>Sexo</label><select id="f-sexo"><option value="">Escolher…</option>${sel(p.sexo,[['m','Masculino'],['f','Feminino']])}</select></div></div>
<div class="f2">${field('f-peso',S.profile?'Peso inicial (kg)':'Peso actual (kg)',p.pesoInicial??p.peso??111)}${field('f-altura','Altura (cm)',p.altura??180)}</div>
<div class="f2">${field('f-meta','Peso desejado (kg)',p.meta,'number')}<div><label>Ritmo desejado</label><select id="f-ritmo">${sel(p.ritmo??.75,[[.5,'0,5 kg/semana'],[.75,'0,75 kg/semana'],[1,'1 kg/semana']])}</select></div></div>
<label>Actividade diária</label><select id="f-act">${sel(p.act??1.55,[[1.2,'Sedentário'],[1.375,'Leve (1–3 treinos/sem.)'],[1.55,'Moderada (5 treinos/sem.)'],[1.725,'Intensa']])}</select>
${field('f-saude','Limitações ou condições de saúde (opcional)',p.saude,'text')}`}
function vHoje(){const p=S.profile,w=lastW(),c=calc(),d=today(),ml=S.water[d]||0,perdido=p.pesoInicial-w,falta=p.meta?w-p.meta:null,a=avg7();
const bk=(Date.now()-(S.meta.lastBackup||S.meta.criado||Date.now()))>7*864e5;
return`<img class="logo sm" src="${LOGO}" alt="GORDURA ZERO"><h1>Hoje</h1><p class="mut">${new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</p>
${bk?`<div class="card warn"><b>Faz uma cópia de segurança.</b><p class="mut">Os dados vivem só neste telemóvel. Exporta uma cópia uma vez por semana.</p><button class="sm p" data-a="export">Exportar agora</button></div>`:''}
<div class="card"><span class="mut">Peso actual</span><div class="big">${r1(w)} <small class="mut" style="font-size:18px">kg</small></div>${a?`<p class="mut">Média 7 dias: ${r1(a)} kg</p>`:''}</div>

function render(){const a=$('#app');
if(locked){a.innerHTML=`<div class="lock"><img class="logo" src="${LOGO}" alt="GORDURA ZERO"><p class="mut">Introduz o PIN</p><input id="pinin" type="password" inputmode="numeric" maxlength="8" autofocus><p id="pe" class="mut"></p><button class="p" data-a="unlock">Entrar</button></div>`;return}

a.innerHTML=`<button class="gear" data-a="go" data-v="cfg" aria-label="Configurações">⚙</button>`+(view==='ia'?'':`<button class="fab" data-a="go" data-v="ia">IA</button>`)+V[view]()+`<nav>${T.map(([k,l])=>`<button class="${k===view?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}</nav>`}

const v=id=>$('#'+id)?.value.trim(), num=id=>{const x=parseFloat((v(id)||'').replace(',','.'));return isFinite(x)&&x>0?x:null};
async function exportData(){const data=await DB.all();Object.keys(data).forEach(k=>{if(/^(vid|foto):/.test(k)||k==='ia')delete data[k]});const blob=new Blob([JSON.stringify({app:'treino-em-casa',v:1,data},null,1)],{type:'application/json'}),name='treino-backup-'+today()+'.json';
const f=new File([blob],name,{type:'application/json'});
try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}}catch(e){return}
S.meta.lastBackup=Date.now();await save('meta');render()}
const A={
go:e=>{view=e.dataset.v;render();scrollTo(0,0)},
water:async e=>{const d=today();S.water[d]=Math.max(0,(S.water[d]||0)+ +e.dataset.v);await save('water');render()},
train:async()=>{const d=today();S.train[d]?delete S.train[d]:S.train[d]=true;await save('train');render()},
saveP:async()=>{const p={idade:num('f-idade'),sexo:v('f-sexo'),altura:num('f-altura'),meta:num('f-meta'),ritmo:+v('f-ritmo'),act:+v('f-act'),saude:v('f-saude')},pw=num('f-peso');
if(!p.idade||!p.sexo||!p.altura||!pw)return alert('Preenche idade, sexo, peso e altura.');
if(p.meta&&p.meta>=pw)return alert('O peso desejado deve ser inferior ao peso actual.');
const first=!S.profile;p.pesoInicial=pw;p.peso=pw;S.profile=Object.assign({},S.profile,p);await save('profile');
if(first){S.meta.criado=Date.now();await save('meta');S.weights=[{d:today(),w:pw}];await save('weights')}render()},
saveW:async()=>{const d=v('e-d')||today(),e={d};['w','ab','ci','pe','br','co','gc'].forEach(k=>{const x=num('e-'+k);if(x)e[k]=x});if(Object.keys(e).length<2)return alert('Preenche pelo menos um valor.');
const i=S.weights.findIndex(x=>x.d===d);if(i>=0)Object.assign(S.weights[i],e);else S.weights.push(e);S.weights.sort((a,b)=>a.d<b.d?-1:1);await save('weights');render()},
delW:async e=>{if(!confirm('Apagar este registo?'))return;S.weights=S.weights.filter(x=>x.d!==e.dataset.v);await save('weights');render()},
setPin:async()=>{const p=v('pin');if(!/^\d{4,8}$/.test(p||''))return alert('Usa 4 a 8 dígitos.');const salt=crypto.getRandomValues(new Uint8Array(16));S.pin={salt:[...salt],hash:await hashPin(p,salt)};await save('pin');render()},
rmPin:async()=>{S.pin=null;await save('pin');render()},
unlock:async()=>{const h=await hashPin($('#pinin').value,new Uint8Array(S.pin.salt));if(h===S.pin.hash){locked=false;render()}else{$('#pe').textContent='PIN incorrecto.'}},
export:exportData,
import:()=>$('#imp').click(),
wipe:async()=>{if(!confirm('Apagar TODOS os dados deste telemóvel? Não dá para desfazer.'))return;await DB.clear();location.reload()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('change',async e=>{if(e.target.id!=='imp'||!e.target.files[0])return;
try{const j=JSON.parse(await e.target.files[0].text());if(j.app!=='treino-em-casa')throw 0;if(!confirm('Isto substitui os dados actuais. Continuar?'))return;
for(const k of await DB.keys())if(!/^(vid|foto):/.test(k))await DB.del(k);for(const k in j.data)await DB.set(k,j.data[k]);location.reload()}catch(x){alert('Ficheiro de cópia inválido.')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&locked)A.unlock()});
(async()=>{Object.assign(S,await DB.all());S.weights=S.weights||[];S.water=S.water||{};S.train=S.train||{};S.meta=S.meta||{};locked=!!S.pin;
navigator.storage?.persist?.();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();

<script>'use strict';

const GN={pernas:'Pernas e glúteos',core:'Abdómen e core',peito:'Peito',costas:'Costas',ombros:'Ombros',corpo:'Corpo inteiro',cardio:'Cardio'},EQN={corpo:'Peso corporal',pneu:'Pneu',mochila:'Mochila'};
const EX=[

['polich','Polichinelo','cardio','corpo',1,'Abre e fecha braços e pernas com salto. Sem saltos: passo lateral com braços acima da cabeça.','Aterra suavemente.'],

['pneupush','Empurrar o pneu','corpo','pneu',0,'Pneu encostado a uma parede: mãos no pneu, corpo inclinado, empurra com as pernas.','Superfície plana; pneu estável.'],
['pneuflip','Virar o pneu','corpo','pneu',0,'Agacha, mãos por baixo da banda, sobe com as pernas e empurra para virar.','Usa um pneu leve; não curves a lombar.'],
['pneuflex','Flexão com mãos no pneu','peito','pneu',0,'Mãos no pneu apoiado no chão; desce e empurra.','O pneu não pode rolar.'],
['pneustep','Subir ao pneu (step-up)','pernas','pneu',0,'Sobe para cima de um pneu estável, estende a perna e baixa com controlo.','Só numa pilha estável.'],
['mremada','Remada com mochila','costas','mochila',0,'Inclina a anca, costas direitas, puxa a mochila ao abdómen.','Costas neutras.'],
['magach','Agachamento com mochila','pernas','mochila',0,'Segura a mochila ao peito e agacha com o tronco erguido.','Começa leve.'],
['mterra','Levantamento terra com mochila','costas','mochila',0,'Anca para trás, costas direitas, desce a mochila pelas pernas e sobe.','Nunca curves a lombar.'],
['mpress','Press de ombros com mochila','ombros','mochila',0,'Mochila ao nível dos ombros, empurra para cima e desce devagar.','Abdómen contraído.']
].map(a=>({id:a[0],nome:a[1],grupo:a[2],equip:a[3],saltos:a[4],desc:a[5],seg:a[6]}));
const allEx=()=>EX.concat(S.custom||[]),exById=id=>allEx().find(e=>e.id===id)||{nome:'?',desc:''};
let P=null,openEx=null,VID={},gc={dias:5,min:40,pneu:true,mochila:true,sem:true},fil='';
const FOCO=[['pernas','core','cardio'],['peito','costas','core'],['corpo','cardio','pernas'],['costas','ombros','braços'],['corpo','pernas','cardio'],['peito','pernas','core']];
function gerar(c){const pool=allEx().filter(e=>(e.equip==='corpo'||c[e.equip])&&!(c.sem&&e.saltos)&&!((S.pref||{}).exc||[]).includes(e.id)),R=c.min>=35?4:3,n=Math.max(4,Math.min(8,Math.floor((c.min-6)/R))),used={},dias=[];
for(let d=0;d<c.dias;d++){const f0=FOCO[d%FOCO.length],pr=(S.pref||{}).prio,f=pr&&!f0.includes(pr)?[f0[0],f0[1],pr]:f0,ids=[];for(let t=0;ids.length<n&&t<60;t++){const g=f[ids.length%f.length],low=(a,b)=>(used[a.id]||0)-(used[b.id]||0)||Math.random()-.5;
const e=pool.filter(x=>x.grupo===g&&!ids.includes(x.id)).sort(low)[0]||pool.filter(x=>!ids.includes(x.id)).sort(low)[0];if(!e)break;ids.push(e.id);used[e.id]=(used[e.id]||0)+1}
dias.push({nome:'Treino '+(d+1),ids,rounds:R,trab:40,desc:20,min:ids.length*R+6})}
return{criado:today(),cfg:c,dias,prox:0}}
const nextDay=()=>S.plan&&S.plan.dias[S.plan.prox];
function cardTreino(){const d=nextDay();return`<div class="card"><h2>Treino de hoje</h2>${S.log&&S.log[today()]?'<p class="mut">Feito hoje ✓ Bom trabalho.</p>':''}${d?`<p><b>${d.nome}</b> · ≈ ${d.min} min</p><button class="p" data-a="go" data-v="treino">Abrir treino</button>`:`<p class="mut">Ainda não tens um plano.</p><button class="p" data-a="go" data-v="treino">Criar plano</button>`}</div>`}
function startDia(i){const d=S.plan.dias[i],seq=[];for(let r=1;r<=d.rounds;r++)d.ids.forEach((id,k)=>{seq.push({t:'w',id,dur:d.trab,r});if(!(r===d.rounds&&k===d.ids.length-1))seq.push({t:'r',id:d.ids[(k+1)%d.ids.length],dur:d.desc,r})});
P={i,seq,k:0,paused:false,t0:Date.now(),end:Date.now()+seq[0].dur*1000,left:seq[0].dur};P.iv=setInterval(tick,500);render()}
function adv(){P.k++;if(P.k>=P.seq.length)return fim();P.end=Date.now()+P.seq[P.k].dur*1000;P.left=P.seq[P.k].dur;navigator.vibrate&&navigator.vibrate(200)}
function tick(){if(!P||P.paused)return;const l=Math.ceil((P.end-Date.now())/1000);if(l<=0)adv();else if(l!==P.left)P.left=l;else return;render()}
async function fim(){clearInterval(P.iv);const m=Math.max(1,Math.round((Date.now()-P.t0)/6e4));S.log=S.log||{};S.log[today()]={dia:P.i,min:m};S.train[today()]=true;S.plan.prox=(P.i+1)%S.plan.dias.length;await save('log');await save('train');await save('plan');P=null;window.FBX=1;render();alert('Treino concluído. Boa!')}
function vPlayer(){const s=P.seq[P.k],e=exById(s.id),w=s.t==='w';return`<div class="card"><p class="mut">${w?'Trabalho':'Descanso · a seguir'} · volta ${s.r}/${S.plan.dias[P.i].rounds}</p><h1>${esc(e.nome)}</h1><div class="tm ${w?'':'rest'}">${P.left}</div><p class="mut">${esc(e.desc)}</p><div class="bar"><i style="width:${(P.k+1)/P.seq.length*100}%"></i></div><div class="row"><button class="p" data-a="pause">${P.paused?'Retomar':'Pausar'}</button><button data-a="skip">Saltar</button><button class="d" data-a="stop">Terminar</button></div></div>`}

<script>'use strict';

async function gem(contents,json){const c=S.ia||{};if(!c.key)throw new Error('Sem chave Gemini. Define-a em Configurações (ou usa só o modo local).');
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${c.model||'gemini-3.8-flash'}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents,generationConfig:json?{responseMimeType:'application/json'}:{}})});

${H.map(m=>`<div class="msg ${m.role==='user'?'u':''}">${md(m.parts[0].text.replace(/^\[Dados do utilizador\].*?\n\n/s,''))}</div>`).join('')}${busy?'<p class="mut">A pensar…</p>':''}

async function frames(b,n=6){const u=URL.createObjectURL(b),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error('Não consegui abrir o vídeo.'));setTimeout(()=>no(new Error('O vídeo demorou demasiado a abrir.')),15000)});
const d=v.duration||1,cv=document.createElement('canvas'),sc=Math.min(1,512/(v.videoWidth||512));cv.width=(v.videoWidth||512)*sc;cv.height=(v.videoHeight||512)*sc;const cx=cv.getContext('2d'),o=[];
for(let i=0;i<n;i++){v.currentTime=d*(i+.5)/n;await new Promise(ok=>{v.onseeked=ok;setTimeout(ok,3000)});cx.drawImage(v,0,0,cv.width,cv.height);o.push(cv.toDataURL('image/jpeg',.7).split(',')[1])}
URL.revokeObjectURL(u);return o}

ANA[id]={wait:1};render();try{const b=await DB.get('vid:'+id),fr=await frames(b);
const pr=`Estas ${fr.length} imagens são fotogramas, por ordem, de um vídeo de um exercício feito em casa. Responde SÓ em JSON com as chaves: identificado (boolean; false se não tiveres segurança), nome, grupo (um de: pernas, core, peito, costas, ombros, corpo, cardio), musculos, equipamento, dificuldade (fácil, média ou difícil), series (número), repeticoes (texto), descanso_s (número), riscos (só o que se vê; vazio se nada), confianca (baixa, média ou alta), pergunta (o que precisas que o utilizador confirme, se identificado for false). Nunca finjas identificar um movimento que não vês com clareza. Notas do utilizador: ${x.desc||'nenhuma'}.`;

ANA[id]=JSON.parse(t.replace(/```json|```/g,'').trim())}catch(er){ANA[id]={err:'Falhou: '+er.message}}render()},

<script>'use strict';
/* Lembretes dentro da app + fotos de evolução (etapa 6) */
const LD={treino:{on:1,h:'18:00'},peso:{on:1,h:'08:00'},agua:{on:1},medidas:{on:1},refeicoes:{on:1,h:'20:00'},descanso:{on:0,h:'22:30'},avaliacao:{on:1},feito:{}};
const LN={treino:'Treino',peso:'Pesagem',agua:'Água',medidas:'Medidas (semanal)',refeicoes:'Registo de refeições',descanso:'Hora de dormir',avaliacao:'Avaliação semanal (domingo)'};
const getL=()=>{S.lemb=S.lemb||{};for(const k in LD)if(!S.lemb[k])S.lemb[k]=JSON.parse(JSON.stringify(LD[k]));return S.lemb};
function pend(){const L=getL(),d=today(),n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),o=[],c=calc(),ml=S.water[d]||0;
const at=k=>L[k].on&&hm>=L[k].h;
if(at('treino')&&!(S.log&&S.log[d]))o.push(['Hora de treinar.']);
if(at('peso')&&!S.weights.some(x=>x.d===d&&x.w))o.push(['Ainda não registaste o peso de hoje.']);
if(L.agua.on){const f=Math.max(0,Math.min(1,(n.getHours()-7)/14));if(ml<f*c.agua*.8)o.push([`Água atrasada: ${ml} de ${c.agua} ml.`])}
if(L.medidas.on&&!S.weights.some(x=>x.ab&&Date.now()-new Date(x.d)<7*864e5))o.push(['Mede o abdómen e a cintura esta semana.']);
if(at('refeicoes')&&!((S.diario||{})[d]||[]).length)o.push(['Regista o que comeste hoje.']);
if(L.descanso.on&&(hm>=L.descanso.h||hm<'04:00'))o.push(['Hora de descansar: o sono ajuda a perder gordura e a recuperar.']);
if(L.avaliacao.on&&n.getDay()===0&&L.feito.avaliacao!==d)o.push(['Avaliação semanal: compara peso, medidas e treinos da semana.','avaliacao']);
return o}

<script>'use strict';
/* Progressão com aprovação, resumo semanal e cópia de fotos/vídeos (etapa 7) */
const opt=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');

function propor(){const L=Object.values(S.log||{}).filter(x=>x.esf),n=L.length;if(n-(S.fbMark||0)<2||S.prop)return;const u=L.slice(-3),m=u.reduce((t,x)=>t+x.esf,0)/u.length,dor=u.some(x=>x.dor==='forte'),ma=u.filter(x=>x.rec==='má').length;
if(dor||m>=9||ma>=2)S.prop={t:'baixar',txt:dor?'Registaste dor forte. Proponho treinos mais leves (menos uma volta ou mais descanso). Evita os exercícios que doem; se persistir, procura um profissional de saúde.':'O esforço está muito alto ou a recuperação fraca. Proponho aliviar: menos uma volta (ou mais descanso).'};
else if(m<=6.5&&ma===0)S.prop={t:'subir',txt:'Os treinos estão a sair com esforço baixo e boa recuperação. Proponho subir: mais uma volta (ou mais 5 s de trabalho).'}}
function cardProp(){return S.prop?`<div class="card warn"><h2>Proposta de ajuste</h2><p>${esc(S.prop.txt)}</p><div class="row"><button class="p" data-a="okProp">Aceitar</button><button data-a="noProp">Agora não</button></div></div>`:''}

return`<div class="card"><h2>Esta semana</h2><p>Treinos: ${n} de ${alvo} · pendentes: ${Math.max(0,alvo-n)}</p><div class="bar"><i style="width:${Math.min(100,n/alvo*100)}%"></i></div>${dw!=null?`<p>Peso (média de 7 dias): ${dw>0?'+':''}${r1(dw)} kg face à semana anterior. Meta: −${r1(calc().real)} kg.</p>${dw>-.1?'<p class="mut">Possível estagnação. Dá mais uma semana, confere porções, sono e água, ou pede ao assistente para analisar.</p>':''}`:'<p class="mut">Precisas de pesagens em duas semanas para ver a variação.</p>'}</div>`}

const CUE={'Retração escapular na barra':'Pendurado, aproxima as omoplatas sem dobrar os cotovelos.','Prancha com toque no ombro':'Corpo em linha; não balances a anca ao tocar o ombro.','Remada australiana':'Corpo reto, peito à barra, aperta as omoplatas no topo.','Remada invertida em L':'Pernas em L, puxa o peito à barra com o core firme.','Flexão inclinada':'Corpo em linha, desce o peito com controlo.','Flexão de tríceps na barra':'Cotovelos juntos ao corpo, desce devagar.','Caminhada afundo':'Passo largo, joelho de trás quase ao chão, tronco erguido.','Flexão em pike':'Anca alta em V, desce a cabeça entre as mãos.','Canoinha':'Braços e pernas no ar, lombar colada ao chão.','Abdominal bicicleta':'Cotovelo ao joelho oposto, devagar, sem puxar o pescoço.','Abdominal invertida':'Sobe a anca com controlo, sem balançar.','Prancha':'Glúteos e abdómen contraídos; respira sem prender o ar.','Remada australiana declinada':'Pés elevados: mais difícil. Corpo em tábua.','Flexão de tríceps na argola':'Argola estável, cotovelos juntos, sobe com controlo.','Flexão inclinada intermediária':'Mãos mais baixas que na inclinada, core firme.','Flexão inclinada aberta':'Mãos mais abertas: trabalha mais o peito.','Flexão inclinada diamante na paralela':'Mãos juntas, cotovelos colados ao corpo.','Flexão pike declinada':'Pés elevados, descida lenta, cabeça entre os braços.','Afundo com salto':'Aterra suave, joelho alinhado com o pé.','Flexão de cotovelo':'Corpo em linha, cotovelos a 90°.','Elevação na paralela':'Ombros afastados das orelhas, sobe sem balançar.','Puxada na argola':'Puxa com as costas, cotovelos para baixo e para trás.','Flexão diamante':'Mãos sob o peito, cotovelos junto ao corpo.','Flexão militar':'Cotovelos colados ao tronco, descida controlada.','Flexão aberta':'Mãos largas, peito quase ao chão.','Spike declinada':'Pés elevados, anca alta, empurra com os ombros.','Avanço + saltos alternados':'Avanços seguidos de saltos; aterra suave.','Barra australiana':'Corpo reto, peito à barra.','Flexão de cotovelos':'Corpo em linha, cotovelos a 90°.','Abdominal invertido':'Joelhos ao peito, sobe a anca com controlo.'};
const OV=()=>(S.ovr=S.ovr||{}),ok=(n,nm)=>n+'|'+nm;let ed=null,VXU={};
const eff=(n,e)=>{const o=OV()[ok(n,e[0])]||{},c=CT();return{nome:e[0],reps:o.reps!=null?o.reps:e[1],seg:o.seg!=null?o.seg:e[2],trab:o.trab||c.trab,desc:o.desc!=null?o.desc:c.desc,ser:o.ser||c.voltas,nota:e[3]}};
function build(n){const c=CT(),q=[];
if(c.aq){AQ.forEach(a=>q.push({t:'tempo',e:[a[0],0,a[1]],fase:'aq',dur:a[1]}));q.push({t:'rest',dur:15})}
NIV[n].forEach((C,ci)=>{const L=C.ex.map(e=>eff(n,e)),mx=Math.max(...L.map(x=>x.ser));for(let v=1;v<=mx;v++){const L2=L.filter(x=>x.ser>=v);L2.forEach((x,k)=>{const b={e:[x.nome,x.reps,x.seg,x.nota],ci,v,mx};if(x.reps)q.push(x.trab>0?{t:'tempo',...b,w:1,dur:x.trab}:{t:'reps',...b});if(x.seg)q.push({t:'tempo',...b,dur:x.seg});q.push({t:'rest',ci,v,mx,dur:k===L2.length-1?c.descV:x.desc})})}});
while(q.length&&q[q.length-1].t==='rest')q.pop();
if(c.al)AL.forEach(a=>q.push({t:'tempo',e:[a[0],0,a[1]],fase:'al',dur:a[1]}));
if(c.prep>0)q.unshift({t:'prep',dur:c.prep});
q.forEach((s,i)=>{if(s.t==='rest'||s.t==='prep'){const x=q.slice(i+1).find(y=>y.t!=='rest');s.next=x?x.e[0]:''}});return q}
async function loadVX(nm){if(!nm||VXU[nm]||!(S.vxl||{})[nm])return;const b=await DB.get('vid:ex:'+nm);if(b){VXU[nm]=URL.createObjectURL(b);if(Q&&!Q.done)render()}}
function enter(){const s=Q.seq[Q.k];Q.reps=0;Q.el=0;Q.ts=now();Q.paused=false;Q.sec=-1;if(s.dur){Q.end=now()+s.dur*1000;Q.left=s.dur}else Q.left=0;loadVX(s.t==='rest'||s.t==='prep'?s.next:s.e[0]);voz(say(s))}
function emb(u){return location.protocol==='file:'?`<div class="card" style="background:var(--bg)"><p class="mut">O YouTube não deixa mostrar vídeos num ficheiro aberto do computador (erro 153). Funciona com a app publicada (https) ou num servidor local. Para ver já, anexa o teu vídeo ao exercício (✎ na lista de exercícios).</p></div>`:`<iframe src="https://www.youtube-nocookie.com/embed/${yid(u)}?playsinline=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px"></iframe>`}
function vPlayer2(){const s=Q.seq[Q.k],rest=s.t==='rest'||s.t==='prep',r=s.t==='reps',nm=rest?s.next:s.e[0],u=YTX()[nm]||YT()[Q.n],big=s.dur?Q.left:fmt(el());
const hd=s.t==='prep'?'Preparação':s.fase?(s.fase==='aq'?'Aquecimento':'Volta à calma'):s.mx?`Circuito ${s.ci+1} · série ${s.v}/${s.mx}`:'Descanso';
const vid=VXU[nm]?`<video src="${VXU[nm]}" controls playsinline loop muted autoplay style="width:100%;border-radius:10px;margin-top:8px"></video>`:yid(u)?emb(u):`<div class="card" style="background:var(--bg)"><p class="mut">Sem vídeo para este exercício. Cola o link do YouTube:</p><input id="vx-in" type="url" placeholder="https://youtu.be/..."><br><br><button class="sm p" data-a="vxSave" data-v="${esc(nm)}">Guardar vídeo</button></div>`;
return`<div class="card"><p class="mut">Nível ${Q.n} · ${hd} · passo ${Q.k+1}/${Q.seq.length}${Q.paused?' · <b style="color:var(--or)">EM PAUSA</b>':''}</p>
${rest?`<p class="mut">${s.t==='prep'?'Preparação':'Descanso'} · a seguir</p>`:''}<h1>${esc(nm)}${s.t==='tempo'&&s.e[1]&&!s.w?' · isometria':''}</h1>${CUE[nm]?`<p class="mut">💡 ${esc(CUE[nm])}</p>`:''}
<div class="tm ${rest?'rest':''}" id="qt">${big}</div>
${r?`<p style="font-size:22px;margin:0">Repetições <b id="qr">${Q.reps}/${s.e[1]}</b></p>${s.e[3]?`<p class="mut">${esc(s.e[3])}</p>`:''}`:`${s.w?`<p style="font-size:22px;margin:0">Meta: <b>${s.e[1]} repetições</b></p>`:''}<p class="mut">${s.dur&&!rest?'tempo restante (s)':rest?'segundos':''}</p>`}
<div class="row" style="margin-top:12px">${r?`<button class="p" data-a="qrep" style="flex:1;padding:18px;font-size:18px">+1 repetição</button>`:`<button class="p" data-a="qpause" style="flex:1;padding:18px;font-size:18px">${Q.paused?'Retomar':'Pausar'}</button>`}</div>
<div class="row" style="margin-top:8px"><button data-a="qprev">◀ Anterior</button>${r?`<button data-a="qpause">${Q.paused?'Retomar':'Pausar'}</button>`:''}<button data-a="qskip">Saltar ▶</button><button class="d" data-a="qstop">Terminar</button></div>${vid}</div>`}
function panel(n,e){const x=eff(n,e),nm=e[0],o=OV()[ok(n,nm)]||{},vx=(S.vxl||{})[nm],inp=(id,l,val)=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="numeric" value="${val}"></div>`;
return`<div style="margin-top:10px"><div class="f2">${e[1]?inp('ed-r','Repetições',x.reps)+inp('ed-t','Tempo de trabalho (s) · 0 = padrão',o.trab||0):''}${e[2]?inp('ed-s','Duração (s)',x.seg):''}${inp('ed-d','Descanso depois (s)',x.desc)}${inp('ed-n','Séries',x.ser)}</div>
<label>Link do YouTube</label><input id="ed-l" type="url" value="${esc(YTX()[nm]||'')}" placeholder="https://youtu.be/...">
<label>Ou o teu vídeo (fica guardado no telemóvel)</label><input id="ed-f" type="file" accept="video/*" data-nm="${esc(nm)}">${vx?`<p class="mut">Vídeo anexado ✓ <button class="sm d" data-a="edDelVid" data-v="${esc(nm)}">Remover</button></p>`:''}
<div class="row" style="margin-top:10px"><button class="p sm" data-a="edSave" data-v="${esc(nm)}">Guardar</button><button class="sm" data-a="edReset" data-v="${esc(nm)}">Repor padrão</button></div></div>`}
function vT2(){if(Q)return vPlayer2();if(window.FBX)return vFB();const t=T2(),c=CT(),n=t.nivel,f=t.feitos[n]||0;
const row=e=>{const x=eff(n,e),has=YTX()[e[0]]||(S.vxl||{})[e[0]],mod=!!OV()[ok(n,e[0])],sm=[x.reps?x.reps+' rep':'',x.reps&&x.trab?x.trab+' s':'',x.seg?x.seg+' s':'',x.ser!==c.voltas?x.ser+' séries':''].filter(Boolean).join(' · ');
return`<div class="li" style="display:block"><div data-a="edOpen" data-v="${esc(e[0])}" style="display:flex;justify-content:space-between;gap:8px;cursor:pointer"><span>${esc(e[0])}${has?' 🎬':''}${mod?' ✎':''}</span><span class="mut">${sm} ▾</span></div>${ed===e[0]?panel(n,e):''}</div>`};
return`<h1>Treinos</h1><div class="card"><h2>Nível ${n} · ${f}/${SESS} sessões</h2><div class="bar"><i style="width:${Math.min(100,f/SESS*100)}%"></i></div><div class="row">${[1,2,3].map(i=>`<button class="sm ${i===n?'p':''}" data-a="lvl" data-v="${i}">Nível ${i}</button>`).join('')}</div>
${f>=SESS&&n<3?`<p style="margin-top:10px">Completaste ${SESS} sessões. Queres subir para o nível ${n+1}?</p><button class="p" data-a="lvlUp">Subir de nível</button>`:''}</div>
<div class="card"><h2>Duração estimada: ≈ ${mins(n)} min</h2><p class="mut">${c.aq?'Aquecimento · ':''}${NIV[n].length} circuitos${c.al?' · volta à calma':''}. Toca num exercício para ajustar repetições, tempo, descanso, séries e vídeo. O tempo total actualiza sozinho.</p><button class="p" data-a="qstart" style="width:100%;padding:16px">Iniciar treino</button></div>
<div class="card">${NIV[n].map(C=>`<h2>${C.c}</h2>${C.ex.map(row).join('')}`).join('<br>')}</div>
<div class="card"><h2>Tempos do treino</h2><p class="mut">Preparação ${c.prep} s · ${c.trab?'trabalho '+c.trab+' s':'por repetições'} · descanso ${c.desc} s (${c.descV} s entre séries) · ${c.voltas} série(s)</p><button class="sm" data-a="go" data-v="cfg">Alterar em Configurações</button></div>
<div class="card"><h2>Semana sugerida</h2><p class="mut">4 treinos de calistenia (ex.: seg, ter, qui, sex), 2 caminhadas rápidas de 30–45 min (qua, sáb) e 1 dia de descanso. A caminhada queima gordura sem roubar recuperação dos músculos.</p></div>
<div class="card"><h2>Dicas do treinador</h2><p class="mut">• Esforço alvo 7–8 em 10: termina cada série com cerca de 2 repetições de reserva.<br>• Técnica antes de velocidade: desce em 2–3 s nas flexões e remadas.<br>• Expira no esforço e não prendas a respiração.<br>• Proteína em todas as refeições e 7–8 h de sono preservam o músculo enquanto perdes gordura.<br>• Fizeste todas as repetições com boa técnica em 2 treinos seguidos? Sobe 1–2 repetições ou 1 série.</p></div>`}

Object.assign(A,{
edOpen:e=>{ed=ed===e.dataset.v?null:e.dataset.v;render()},
edSave:async e=>{const nm=e.dataset.v,n=T2().nivel,ex=NIV[n].flatMap(C=>C.ex).find(x=>x[0]===nm),c=CT(),o={},g=id=>{const el=$('#'+id);return el?parseInt(el.value):NaN};
const r=g('ed-r'),t=g('ed-t'),s2=g('ed-s'),d=g('ed-d'),sr=g('ed-n');
if(r>0&&r!==ex[1])o.reps=r;if(t>0)o.trab=t;if(s2>0&&s2!==ex[2])o.seg=s2;if(d>=0&&d!==c.desc)o.desc=d;if(sr>0&&sr!==c.voltas)o.ser=Math.min(8,sr);
const l=v('ed-l');if(l&&!yid(l))return alert('Link do YouTube inválido.');const k=ok(n,nm);Object.keys(o).length?OV()[k]=o:delete OV()[k];YTX()[nm]=l||'';await save('ovr');await save('ytx');ed=null;render()},

<script>'use strict';
/* Biblioteca com ficha completa por exercício */
const ALI={'Spike declinada':'Flexão pike declinada','Barra australiana':'Remada australiana','Flexão de cotovelos':'Flexão de cotovelo','Abdominal invertido':'Abdominal invertida'};
const I=(a,m,sc,d,ex,er,t)=>[a,m,sc,d,ex,er,t];
const INFO={
'Retração escapular na barra':I('Costas e ombros','Trapézio médio e inferior, romboides, dorsais',[1,0,3,1],2,'Pendura-te na barra com os braços esticados. Sem dobrar os cotovelos, puxa as omoplatas para baixo e para trás (o corpo sobe pouco). Segura 1 s e solta devagar.','Dobrar os cotovelos, balançar o corpo, encolher os ombros para as orelhas.','Imagina que guardas as omoplatas nos bolsos de trás. Base de saúde dos ombros.'),
'Prancha com toque no ombro':I('Core e ombros','Reto abdominal, transverso, oblíquos, ombros',[2,3,2,3],2,'Em prancha alta, pés ligeiramente afastados. Toca o ombro oposto com uma mão, volta ao chão e alterna.','Rodar ou balançar a anca, afundar a lombar.','Pés mais afastados = mais estabilidade. Contrai glúteos e abdómen.'),
'Remada australiana':I('Costas e braços','Dorsais, romboides, trapézio, bíceps',[2,1,3,1],2,'Deita-te sob a barra e agarra-a à largura dos ombros, corpo reto dos calcanhares à cabeça. Puxa o peito à barra e desce com controlo.','Deixar a anca cair, puxar só com os braços, não completar o movimento.','Quanto mais horizontal o corpo, mais difícil. Aperta as omoplatas no topo.'),
'Remada invertida em L':I('Costas e core','Dorsais, romboides, bíceps, abdominais, flexores da anca',[2,2,3,2],3,'Na posição de remada, eleva as pernas esticadas à frente formando um L e puxa o peito à barra sem desfazer o L.','Deixar as pernas caírem, arquear a lombar.','Se for difícil, dobra os joelhos (L encolhido).'),
'Flexão inclinada':I('Peito, ombros e tríceps','Peitoral, deltoide anterior, tríceps, core',[2,1,2,1],1,'Mãos num apoio firme (barra, banco), corpo em linha. Desce o peito até ao apoio e empurra.','Anca caída ou levantada, cotovelos muito abertos.','Quanto mais alto o apoio, mais fácil. Cotovelos a cerca de 45° do corpo.'),
'Flexão de tríceps na barra':I('Braços (tríceps)','Tríceps, peito, ombros',[1,1,2,1],2,'Mãos na barra à altura da cintura, corpo inclinado. Dobra os cotovelos levando a testa à barra e estende.','Cotovelos abertos, ombros encolhidos.','Cotovelos para a frente e juntos. Desce em 2–3 s.'),
'Caminhada afundo':I('Pernas e glúteos','Quadríceps, glúteos, isquiotibiais, estabilizadores',[3,1,2,3],1,'Passo largo, desce o joelho de trás perto do chão, sobe e passa à perna seguinte.','Joelho da frente a passar a ponta do pé, tronco inclinado.','Passos mais longos trabalham mais o glúteo. Olha em frente para manteres o equilíbrio.'),
'Flexão em pike':I('Ombros e tríceps','Deltoides, tríceps, core',[2,1,3,1],2,'Anca alta em V invertido, mãos e pés no chão. Dobra os cotovelos levando a cabeça entre as mãos e empurra.','Costas curvadas, cabeça a bater no chão.','Pés mais perto das mãos = mais difícil.'),
'Canoinha':I('Abdómen','Reto abdominal, transverso',[2,3,1,2],1,'Deitado de costas, levanta braços e pernas esticados e mantém, com a lombar colada ao chão.','Lombar arqueada, prender a respiração.','Pernas mais altas = mais fácil. Respira devagar.'),
'Abdominal bicicleta':I('Abdómen e oblíquos','Reto abdominal, oblíquos',[2,3,1,2],1,'Deitado, mãos atrás da cabeça. Leva o cotovelo ao joelho oposto, alternando devagar.','Puxar o pescoço, ir depressa demais.','Roda o tronco, não só os cotovelos. Lento e controlado vale mais.'),
'Abdominal invertida':I('Abdómen inferior','Reto abdominal inferior, flexores da anca',[2,3,1,1],2,'Deitado, pernas no ar. Sobe a anca do chão levando os joelhos ao peito e desce com controlo.','Balançar as pernas, usar o embalo.','Pensa em enrolar a bacia, não em atirar as pernas.'),
'Prancha':I('Core','Transverso, reto abdominal, oblíquos, glúteos, ombros',[2,3,2,3],1,'Antebraços no chão, cotovelos sob os ombros, corpo em linha. Contrai abdómen e glúteos e mantém.','Anca caída ou muito alta, prender a respiração.','Qualidade vence tempo: pára quando a lombar cede.'),
'Remada australiana declinada':I('Costas e braços','Dorsais, romboides, bíceps, core',[2,1,3,1],3,'Como a remada australiana, mas com os pés elevados num apoio. Puxa o peito à barra e desce devagar.','Anca caída, pescoço projetado.','Pés elevados aumentam a carga: só sobe se a remada normal estiver fácil.'),
'Flexão de tríceps na argola':I('Braços e core','Tríceps, peito, ombros, estabilizadores',[2,2,3,3],3,'Mãos nas argolas, corpo inclinado. Dobra os cotovelos juntos ao corpo e estende, mantendo as argolas estáveis.','Cotovelos abertos, argolas a balançar.','A instabilidade activa mais músculos. Começa com mais inclinação.'),
'Flexão inclinada intermediária':I('Peito e tríceps','Peitoral, tríceps, ombros, core',[2,1,3,1],2,'Mãos num apoio mais baixo do que na flexão inclinada. Corpo em linha, desce o peito e empurra.','Anca caída, descida rápida.','Baixar o apoio aumenta a dificuldade.'),
'Flexão inclinada aberta':I('Peito','Peitoral, ombros, tríceps',[2,1,3,1],2,'Mãos mais afastadas do que os ombros num apoio inclinado. Desce o peito e empurra.','Cotovelos a 90° do corpo (stress no ombro), amplitude curta.','Mãos só um pouco mais largas que os ombros.'),
'Flexão inclinada diamante na paralela':I('Tríceps e peito','Tríceps, peitoral interno, ombros',[2,1,3,1],3,'Mãos juntas formando um diamante sob o peito, em apoio inclinado. Cotovelos junto ao corpo, desce e empurra.','Cotovelos abertos, punhos tensos.','Se doer o punho, afasta ligeiramente as mãos.'),
'Flexão pike declinada':I('Ombros','Deltoides, tríceps, trapézio, core',[2,1,3,1],3,'Pés elevados, anca alta. Dobra os cotovelos levando a cabeça ao chão entre as mãos e empurra.','Costas curvadas, descida rápida.','Mais elevação dos pés = mais carga nos ombros.'),
'Afundo com salto':I('Pernas e glúteos','Quadríceps, glúteos, gémeos, core',[3,1,2,3],3,'Posição de avanço, salta e troca as pernas no ar, aterrando suavemente em novo avanço.','Aterrar com o joelho a colapsar para dentro, tronco inclinado.','Se tiveres joelhos sensíveis, faz avanço alternado sem salto.'),
'Flexão de cotovelo':I('Peito e tríceps','Peitoral, tríceps, ombros, core',[2,1,3,1],2,'Flexão com os cotovelos junto ao corpo. Desce até os cotovelos formarem cerca de 90° e empurra.','Cotovelos abertos, anca caída.','Segue a variação mostrada no vídeo desta ficha.'),
'Elevação na paralela':I('Tríceps, peito e ombros','Tríceps, peitoral inferior, ombros, core',[2,2,3,2],3,'Em apoio nas paralelas com os braços esticados, sobe e desce o corpo com controlo; no fim mantém a posição.','Ombros encolhidos, balançar.','Mantém os ombros afastados das orelhas. Segue a variação mostrada no vídeo desta ficha.'),
'Puxada na argola':I('Costas e bíceps','Dorsais, romboides, bíceps, antebraços',[2,1,3,2],3,'Agarrado às argolas, puxa o corpo para cima levando as mãos ao peito, cotovelos para baixo e para trás. Desce devagar.','Balançar, não descer em controlo.','A isometria no topo (segurar) aumenta muito a força.'),

${ab.length>1?`<p class="mut">Abdómen: ${ab[0].ab} cm → ${ab[ab.length-1].ab} cm</p>`:''}
<svg viewBox="0 0 320 130"><line x1="0" x2="320" y1="${Y(c.kcal)}" y2="${Y(c.kcal)}" stroke="#F2F4EF" stroke-dasharray="4 4" opacity=".6"/><text x="318" y="${Y(c.kcal)-3}" fill="#F2F4EF" font-size="9" text-anchor="end">meta ${R0(c.kcal)}</text>${bars}</svg>
<p class="mut">Calorias por dia (14 dias). Verde: dentro da meta. Laranja: acima.</p>
<div class="grid"><div class="st"><b>${avgK!=null?R0(avgK):'—'}</b><span>consumo médio (7 dias)</span></div><div class="st"><b>${def!=null?R0(def):'—'}</b><span>défice médio/dia</span></div></div>
${nx('Défice = o que o corpo gasta (estimado) menos o que comes. É ele que faz perder gordura: ~7.700 kcal de défice ≈ 1 kg de gordura. Compara o peso médio desta semana com o da anterior: perder 0,25 a 1 kg por semana é o ideal. Os treinos não aumentam a tua meta; já estão no gasto estimado.')}
${pr?`<div class="card warn" style="margin-bottom:0"><p>${pr.t}</p><div class="row"><button class="sm p" data-a="adjOk" data-v="${pr.d}">Aplicar</button><button class="sm" data-a="adjNo">Agora não</button></div></div>`:''}</div>`}
function n2recs(c,di,t){const o=[],h=new Date().getHours(),ml=S.water[today()]||0,rest=c.kcal-t.k,fr=Math.min(1,t.k/c.kcal);
if(!di.length)o.push('Ainda não registaste nada hoje. Regista a primeira refeição para eu poder orientar-te.');
else{if(t.k>300&&t.p<c.prot*fr*.75)o.push(`Proteína baixa: ${R0(t.p)} g de ${c.prot} g. Na próxima refeição escolhe ovos, peixe, frango ou feijão.`);
if(rest<0)o.push(`Passaste ${R0(-rest)} kcal da meta. Não compenses saltando refeições: na próxima, proteína magra e vegetais.`);else if(rest<c.kcal*.15)o.push(`Estás perto do limite (restam ${R0(rest)} kcal). Termina o dia com proteína e vegetais, sem fritos nem açúcar.`);
if(h>=19&&t.k<c.kcal*.7)o.push('Comeste menos do que o planeado. Comer pouco demais faz perder músculo e aumenta a fome à noite.');
if(t.k>600&&!di.some(x=>['folhas','tomate'].includes(x.id)||/salada|legum|verdur|couve|tomate/i.test(x.nome||'')))o.push('Ainda sem vegetais hoje. Junta salada ou legumes ao próximo prato: dão saciedade com poucas calorias.')}
if(ml<c.agua*Math.max(0,Math.min(1,(h-7)/14))*.75)o.push(`Hidratação atrasada: ${ml} de ${c.agua} ml. Bebe 300–400 ml agora.`);
if(S.log&&S.log[today()]||S.train[today()])o.push('Dia de treino: hidratos moderados (arroz, batata-doce, mandioca) à volta do treino e proteína nas 2 horas seguintes. Não somes as calorias do treino à meta.');
return`<div class="card"><h2>Recomendações</h2>${(o.slice(0,4).length?o.slice(0,4):['Tudo em ordem por agora. Continua assim.']).map(x=>`<p style="margin:6px 0">• ${esc(x)}</p>`).join('')}</div>`}
function n2dia(di){if(!di.length)return'';return`<div class="card"><h2>O que comi hoje</h2>${REF.map((r,m)=>{const a=di.map((x,i)=>({x,i})).filter(z=>z.x.m===m);return a.length?`<p style="margin:8px 0 2px"><b>${r}</b> <span class="mut">${R0(n2t(a.map(z=>z.x)).k)} kcal</span></p>${a.map(z=>`<div class="li"><span>${esc(n2n(z.x))} ${Math.round(z.x.g)} g · ${R0(n2e(z.x).k)} kcal</span><button class="sm d" data-a="delF" data-v="${z.i}">×</button></div>`).join('')}`:''}).join('')}</div>`}
function vN2(){(S.alimentos||[]).forEach(f=>{if(!fd(f.id))FD.push(f)});const c=calc(),di=n2dl(),t=n2t(di);
return`<h1>Nutrição</h1>${n2hero(c,t)}${n2reg()}${n2ph()}${n2prox(c,di,t)}${n2agua(c)}${n2macros(c,t)}${n2evo(c,t)}${n2recs(c,di,t)}${n2dia(di)}
<details class="card"><summary style="cursor:pointer;font-weight:600">Mais ferramentas</summary>${vSemana()}${prato()}<div class="card"><h2>Dicas</h2>${DICAS.map(x=>`<p>${esc(x)}</p>`).join('')}</div></details>`}
window.EXTRA.nutri=vN2;
Object.assign(A,{
manT:()=>{man=!man;render()},fotoRef:()=>$('#ph-in').click(),
proxOk:async()=>{if(!NX)return;S.diario=S.diario||{};const d=today();S.diario[d]=(S.diario[d]||[]).concat(NX.it.map(x=>({m:NX.m,id:x.id,g:x.g})));await save('diario');render()},
phDel:e=>{PH.itens.splice(+e.dataset.v,1);if(!PH.itens.length)PH=null;render()},phNo:()=>{PH=null;render()},
phOk:async()=>{const m=+v('ph-m');S.diario=S.diario||{};const d=today();S.diario[d]=(S.diario[d]||[]).concat(PH.itens.map(x=>({m,nome:x.nome,g:x.g,k:x.kg*x.g,p:x.pg*x.g,c:x.cg*x.g,f:x.fg*x.g,foto:1})));await save('diario');PH=null;render()},
adjOk:async e=>{S.adj=(S.adj||0)+ +e.dataset.v;await save('adj');render()},adjNo:async()=>{S.adjNo=Date.now();await save('adjNo');render()}});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='nt'){S.temp=+t.value;await save('temp');render()}
else if(t.dataset.pi!==undefined&&PH&&PH.itens){PH.itens[+t.dataset.pi].g=Math.max(1,parseFloat(t.value)||1);n2phUpd()}
else if(t.id==='ph-in'&&t.files[0]){const f=t.files[0];t.value='';if(!(S.ia&&S.ia.key))return alert('Define a chave Gemini em Configurações para estimar refeições por foto.');
if(!confirm('Vais enviar esta foto à Google (Gemini, nível gratuito) para estimar a refeição. A foto não fica guardada na app. Continuar?'))return;
PH={wait:1};render();try{const bl=await shrink(f),b64=(await rd(bl)).split(',')[1],url=URL.createObjectURL(bl),r=await gem([{role:'user',parts:[{text:PROMPT},{inlineData:{mimeType:'image/jpeg',data:b64}}]}],true),j=JSON.parse(r.replace(/```json|```/g,'').trim());
const it=(j.itens||[]).map(x=>{const g=Math.max(1,+x.gramas||100);return{nome:x.nome||'?',g,kg:(+x.kcal||0)/g,pg:(+x.proteina||0)/g,cg:(+x.hidratos||0)/g,fg:(+x.gordura||0)/g}});if(!it.length)throw new Error('Não consegui identificar alimentos nesta foto. Tenta outra, mais perto e com boa luz.');PH={url,conf:j.confianca||'baixa',av:j.avisos||'',itens:it}}catch(er){PH={err:'Falhou: '+er.message}}render()}});
